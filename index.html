<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repulsor – WebXR-Prototyp</title>
<style>
  body { margin: 0; background: #111; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
  #info { position: absolute; top: 0; left: 0; right: 0; padding: 16px; text-align: center; line-height: 1.5; z-index: 1; }
  #info h1 { font-size: 20px; margin: 0 0 6px; }
  #info p { margin: 2px 0; font-size: 14px; opacity: .85; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
</head>
<body>
<div id="info">
  <h1>Repulsor</h1>
  <p>Auf der Quest 3 unten auf „START AR“ tippen.</p>
  <p>Linker Trigger halten: ansaugen · Rechter Trigger drücken: Druckwelle · Grip: neue Mauer</p>
</div>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import * as CANNON from 'cannon-es';

// ================= Einstellungen (zum Herumspielen) =================
const CFG = {
  wallDistance: 1.8,  // Abstand der Mauer vor dir (Meter)
  blockSize: 0.22,    // Kantenlänge der Würfel (Meter)
  cols: 6,
  rows: 5,

  // Rechter Controller: Druckwelle
  push: {
    range: 4.5,       // Reichweite (Meter)
    angle: 0.6,       // halber Öffnungswinkel (Radiant, ca. 34°)
    force: 9,         // Geschwindigkeit, die ein Objekt maximal bekommt (m/s)
    speed: 9,         // Ausbreitungsgeschwindigkeit der Welle (m/s)
    cooldown: 0.35,   // Mindestabstand zwischen zwei Wellen (Sekunden)
  },

  // Linker Controller: Ansaugen
  pull: {
    range: 5,         // Reichweite (Meter)
    angle: 0.5,       // halber Öffnungswinkel (Radiant, ca. 29°)
    accel: 28,        // Zugkraft (Beschleunigung in m/s²)
    holdDistance: 0.5,// wie weit vor der Hand die Objekte schweben (Meter)
    holdRadius: 0.7,  // ab diesem Abstand zum Haltepunkt werden Objekte "festgehalten"
    maxSpeed: 5,      // Höchstgeschwindigkeit beim Ansaugen (m/s)
  },
};
const COLORS = [0x4f8cff, 0xff6b6b, 0xffc145, 0x3ddc97, 0xb388ff, 0xff8fd8];
const PUSH_COLOR = 0x66ccff;
const PULL_COLOR = 0xffa040;

// ================= three.js: Renderer, Szene, Kamera =================
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.xr.enabled = true;                          // WebXR einschalten
renderer.xr.setReferenceSpaceType('local-floor');    // y = 0 ist der echte Boden
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);
camera.position.set(0, 1.6, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.1, far: 12 });
scene.add(sun, sun.target);

// Unsichtbarer Boden, der nur Schatten zeigt – so "stehen" die Blöcke auf deinem echten Boden
const shadowFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.ShadowMaterial({ opacity: 0.3 })
);
shadowFloor.rotation.x = -Math.PI / 2;
shadowFloor.receiveShadow = true;
scene.add(shadowFloor);

// ================= cannon-es: Physik =================
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.allowSleep = true;
world.broadphase = new CANNON.SAPBroadphase(world);
world.defaultContactMaterial.friction = 0.4;
world.defaultContactMaterial.restitution = 0.2;

const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
world.addBody(floorBody);

const objects = []; // Paare aus { mesh (Grafik), body (Physik) }

function addObject(kind, pos, yaw, color) {
  const s = CFG.blockSize;
  let geometry, shape, mass;
  if (kind === 'sphere') {
    const r = s * 0.5;
    geometry = new THREE.SphereGeometry(r, 24, 16);
    shape = new CANNON.Sphere(r);
    mass = 0.8;
  } else if (kind === 'cylinder') {
    const r = s * 0.45, h = s * 1.2;
    geometry = new THREE.CylinderGeometry(r, r, h, 16);
    shape = new CANNON.Cylinder(r, r, h, 16);
    mass = 1;
  } else {
    geometry = new THREE.BoxGeometry(s, s, s);
    shape = new CANNON.Box(new CANNON.Vec3(s / 2, s / 2, s / 2));
    mass = 1;
  }

  const mesh = new THREE.Mesh(
    geometry,
    new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.1 })
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  const body = new CANNON.Body({ mass, shape, linearDamping: 0.05, angularDamping: 0.05 });
  body.position.set(pos.x, pos.y, pos.z);
  body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), yaw);
  body.sleepSpeedLimit = 0.2;
  world.addBody(body);

  objects.push({ mesh, body });
}

function clearObjects() {
  for (const { mesh, body } of objects) {
    scene.remove(mesh);
    mesh.geometry.dispose();
    mesh.material.dispose();
    world.removeBody(body);
  }
  objects.length = 0;
}

// Baut eine Mauer aus Würfeln vor der angegebenen Position, plus ein paar Kugeln und Zylinder obendrauf
function spawnWall(headPos, forward) {
  clearObjects();
  const f = forward.clone().setY(0);
  if (f.lengthSq() < 1e-6) f.set(0, 0, -1);
  f.normalize();
  const right = new THREE.Vector3().crossVectors(f, new THREE.Vector3(0, 1, 0)).normalize();
  const origin = headPos.clone().setY(0).addScaledVector(f, CFG.wallDistance);
  const yaw = Math.atan2(f.x, f.z);
  const s = CFG.blockSize;

  for (let r = 0; r < CFG.rows; r++) {
    const offset = (r % 2) ? s / 2 : 0; // versetzt wie bei Ziegeln
    for (let c = 0; c < CFG.cols; c++) {
      const x = (c - (CFG.cols - 1) / 2) * s * 1.01 + offset;
      const p = origin.clone().addScaledVector(right, x);
      p.y = s / 2 + r * s * 1.001 + 0.001;
      addObject('box', p, yaw, COLORS[(r + c) % COLORS.length]);
    }
  }

  const topY = CFG.rows * s + 0.01;
  [-1.5, 1.5].forEach((x, i) => {
    const p = origin.clone().addScaledVector(right, x * s);
    p.y = topY + s * 0.5;
    addObject('sphere', p, yaw, COLORS[(i + 2) % COLORS.length]);
  });
  [-0.5, 0.5].forEach((x, i) => {
    const p = origin.clone().addScaledVector(right, x * s);
    p.y = topY + s * 0.6;
    addObject('cylinder', p, yaw, COLORS[(i + 4) % COLORS.length]);
  });

  sun.position.copy(origin).add(new THREE.Vector3(1.5, 4, 1.5));
  sun.target.position.copy(origin);
}

function respawnInFront() {
  const pos = new THREE.Vector3();
  const dir = new THREE.Vector3();
  camera.getWorldPosition(pos);
  camera.getWorldDirection(dir);
  spawnWall(pos, dir);
}

// ================= Hilfsfunktionen =================
const handPos = new THREE.Vector3();
const handDir = new THREE.Vector3();
const handQuat = new THREE.Quaternion();
const toObj = new THREE.Vector3();
const toTarget = new THREE.Vector3();
const target = new THREE.Vector3();

function readHand(controller) {
  controller.getWorldPosition(handPos);
  controller.getWorldQuaternion(handQuat);
  handDir.set(0, 0, -1).applyQuaternion(handQuat);
}

function haptic(controller, intensity, ms) {
  const actuator = controller.userData.inputSource?.gamepad?.hapticActuators?.[0];
  try { actuator?.pulse(intensity, ms); } catch (e) { /* nicht unterstützt */ }
}

function additiveMaterial(color, opacity) {
  return new THREE.MeshBasicMaterial({
    color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  });
}

// ================= Effekte an der Hand =================
const FX_LENGTH = 1.2;
function makeHandFx() {
  const group = new THREE.Group();

  const core = new THREE.Mesh(new THREE.SphereGeometry(0.015, 16, 12), new THREE.MeshBasicMaterial({ color: PUSH_COLOR }));

  // Kegel für das Ansaugen
  const coneGeo = new THREE.ConeGeometry(Math.tan(CFG.pull.angle) * FX_LENGTH, FX_LENGTH, 32, 1, true);
  coneGeo.rotateX(Math.PI / 2);            // Spitze zeigt zur Hand ...
  coneGeo.translate(0, 0, -FX_LENGTH / 2); // ... und der Kegel öffnet sich nach vorne (-Z)
  const cone = new THREE.Mesh(coneGeo, additiveMaterial(PULL_COLOR, 0.12));
  cone.visible = false;

  // Ringe, die beim Ansaugen zur Hand hin wandern
  const rings = [];
  for (let k = 0; k < 3; k++) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.0, 40), additiveMaterial(PULL_COLOR, 0.5));
    ring.visible = false;
    rings.push(ring);
    group.add(ring);
  }

  group.add(core, cone);
  return { group, core, cone, rings, flash: 0 };
}

// ================= Rechts: Druckwelle =================
const waves = [];
const waveGeo = new THREE.RingGeometry(0.85, 1.0, 64);

function fireShockwave(controller) {
  readHand(controller);
  const ring = new THREE.Mesh(waveGeo, additiveMaterial(PUSH_COLOR, 0.8));
  scene.add(ring);
  waves.push({
    origin: handPos.clone(),
    dir: handDir.clone(),
    quat: handQuat.clone(),
    radius: 0.05,
    hit: new Set(),
    ring,
  });
  controller.userData.fx.flash = 1;
  haptic(controller, 1.0, 120);
}

function updateWaves(dt) {
  const P = CFG.push;
  const s = CFG.blockSize;
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.radius += P.speed * dt;

    // Jedes Objekt wird genau einmal getroffen, wenn die Wellenfront es erreicht
    for (const { body } of objects) {
      if (w.hit.has(body)) continue;
      toObj.set(body.position.x - w.origin.x, body.position.y - w.origin.y, body.position.z - w.origin.z);
      const dist = toObj.length();
      if (dist > w.radius || dist > P.range || dist < 1e-3) continue;
      const angle = w.dir.angleTo(toObj);
      if (angle > P.angle) continue;

      w.hit.add(body);
      const falloff = (1 - 0.7 * dist / P.range) * (1 - 0.5 * angle / P.angle);
      const dv = P.force * falloff * body.mass;
      toObj.normalize(); // radial vom Ursprung weg – wie eine echte Druckwelle
      const impulse = new CANNON.Vec3(toObj.x * dv, (toObj.y + 0.25) * dv, toObj.z * dv);
      // leicht außermittig treffen, damit die Objekte trudeln
      const offset = new CANNON.Vec3(
        (Math.random() - 0.5) * s * 0.6,
        (Math.random() - 0.5) * s * 0.6,
        (Math.random() - 0.5) * s * 0.6
      );
      body.wakeUp();
      body.applyImpulse(impulse, offset);
    }

    // Sichtbare Wellenfront: ein Ring, der wächst und verblasst
    const t = w.radius / P.range;
    w.ring.position.copy(w.origin).addScaledVector(w.dir, w.radius * Math.cos(P.angle));
    w.ring.quaternion.copy(w.quat);
    w.ring.scale.setScalar(Math.max(0.01, w.radius * Math.sin(P.angle)));
    w.ring.material.opacity = 0.8 * (1 - t);

    if (w.radius >= P.range) {
      scene.remove(w.ring);
      w.ring.material.dispose();
      waves.splice(i, 1);
    }
  }
}

function updatePushFx(controller, dt) {
  const fx = controller.userData.fx;
  fx.flash = Math.max(0, fx.flash - dt * 5);
  fx.core.scale.setScalar(1 + fx.flash * 3);
}

// ================= Links: Ansaugen =================
function updatePull(controller, dt, time) {
  const ud = controller.userData;
  const fx = ud.fx;
  const P = CFG.pull;

  fx.cone.visible = ud.active;
  fx.rings.forEach(r => { r.visible = ud.active; });
  if (!ud.active) {
    fx.core.scale.setScalar(1);
    return;
  }

  // Ringe wandern von vorne zur Hand
  fx.rings.forEach((ring, k) => {
    const phase = (time * 0.0012 + k / fx.rings.length) % 1;
    const z = FX_LENGTH * (1 - phase);
    ring.position.set(0, 0, -z);
    ring.scale.setScalar(Math.max(0.01, Math.tan(P.angle) * z));
    ring.material.opacity = 0.5 * phase;
  });
  fx.core.scale.setScalar(1.4 + Math.random() * 0.4);

  readHand(controller);
  target.copy(handPos).addScaledVector(handDir, P.holdDistance); // Haltepunkt vor der Hand

  let hits = 0;
  for (const { body } of objects) {
    toObj.set(body.position.x - handPos.x, body.position.y - handPos.y, body.position.z - handPos.z);
    const dist = toObj.length();
    toTarget.set(target.x - body.position.x, target.y - body.position.y, target.z - body.position.z);
    const dTarget = toTarget.length();
    const holding = dTarget < P.holdRadius;

    if (!holding && (dist > P.range || handDir.angleTo(toObj) > P.angle)) continue;

    let accel;
    if (holding) {
      // Nahe am Haltepunkt: sanft festhalten, abbremsen und Schwerkraft ausgleichen
      accel = P.accel * 0.6 * (dTarget / P.holdRadius);
      const damp = Math.max(0, 1 - 5 * dt);
      body.velocity.scale(damp, body.velocity);
      body.angularVelocity.scale(damp, body.angularVelocity);
      body.applyImpulse(new CANNON.Vec3(0, 9.82 * body.mass * dt, 0));
    } else {
      accel = P.accel * (0.4 + 0.6 * (1 - dist / P.range));
    }

    if (dTarget > 1e-3) {
      toTarget.multiplyScalar(1 / dTarget);
      const k = accel * body.mass * dt;
      body.applyImpulse(new CANNON.Vec3(toTarget.x * k, toTarget.y * k, toTarget.z * k));
    }
    body.wakeUp();

    const v = body.velocity.length();
    if (v > P.maxSpeed) body.velocity.scale(P.maxSpeed / v, body.velocity);
    hits++;
  }

  // leichtes, gleichmäßiges Vibrieren
  if (time - ud.lastPulse > 60) {
    ud.lastPulse = time;
    haptic(controller, hits ? 0.35 : 0.1, 60);
  }
}

// ================= Controller (über WebXR) =================
const modelFactory = new XRControllerModelFactory();
const controllers = [];

function setMode(controller, mode) {
  const ud = controller.userData;
  ud.mode = mode;
  ud.active = false;
  ud.fx.core.material.color.setHex(mode === 'pull' ? PULL_COLOR : PUSH_COLOR);
}

for (let i = 0; i < 2; i++) {
  const controller = renderer.xr.getController(i); // Zielstrahl-Position/Richtung aus WebXR
  const fx = makeHandFx();
  controller.add(fx.group);
  controller.userData = { mode: 'push', active: false, inputSource: null, lastPulse: 0, lastShot: 0, fx };

  controller.addEventListener('connected', (e) => {
    controller.userData.inputSource = e.data;
    setMode(controller, e.data.handedness === 'left' ? 'pull' : 'push');
  });
  controller.addEventListener('disconnected', () => {
    controller.userData.inputSource = null;
    controller.userData.active = false;
  });

  controller.addEventListener('selectstart', () => { // Trigger gedrückt
    const ud = controller.userData;
    if (ud.mode === 'pull') {
      ud.active = true;
    } else {
      const now = performance.now() / 1000;
      if (now - ud.lastShot >= CFG.push.cooldown) {
        ud.lastShot = now;
        fireShockwave(controller);
      }
    }
  });
  controller.addEventListener('selectend', () => { controller.userData.active = false; }); // losgelassen
  controller.addEventListener('squeezestart', () => respawnInFront());                       // Grip
  scene.add(controller);

  const grip = renderer.xr.getControllerGrip(i); // für das 3D-Modell des Controllers
  grip.add(modelFactory.createControllerModel(grip));
  scene.add(grip);

  controllers.push(controller);
}

// ================= Start & Spielschleife =================
document.body.appendChild(ARButton.createButton(renderer, { optionalFeatures: ['local-floor'] }));

spawnWall(camera.position, new THREE.Vector3(0, 0, -1)); // Vorschau am Desktop

let spawnPending = 0;
renderer.xr.addEventListener('sessionstart', () => { spawnPending = 5; }); // nach ein paar Frames vor dir aufbauen

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop((time) => {
  const dt = Math.min(clock.getDelta(), 1 / 30);

  if (spawnPending > 0 && --spawnPending === 0) respawnInFront();

  for (const c of controllers) {
    if (c.userData.mode === 'pull') updatePull(c, dt, time);
    else updatePushFx(c, dt);
  }
  updateWaves(dt);

  world.step(1 / 72, dt, 3);

  for (const { mesh, body } of objects) {
    mesh.position.copy(body.position);
    mesh.quaternion.copy(body.quaternion);
  }

  renderer.render(scene, camera);
});
</script>
</body>
</html>
